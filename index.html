<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0d0d0d">
<title>Carné de miembro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #0d0d0d; color: #fff; font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100svh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
  .card { background: #fff; color: #111; border-radius: 20px; padding: 24px; width: min(360px, 100%); text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  /* Marca de la tienda (?b=usad): logo arriba y doble línea de color alrededor de la tarjeta */
  .card.brand { border: 4px solid var(--c1, #EF3118); box-shadow: 0 0 0 4px #fff, 0 0 0 8px var(--c2, #0A3161), 0 14px 44px rgba(0,0,0,.55); }
  .logo { display: none; height: 84px; margin: 0 auto 6px; }
  .card.brand .logo { display: block; }
  .card.brand .kicker { color: var(--c2, #0A3161); }
  .card.brand h1 { color: var(--c1, #EF3118); }
  .card.brand #qr { padding: 10px; border: 2px solid var(--c2, #0A3161); border-radius: 12px; box-sizing: content-box; }
  .kicker { margin: 0; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #666; }
  h1 { margin: 6px 0 16px; font-size: 22px; }
  #qr { width: 240px; height: 240px; margin: 0 auto; }
  #qr canvas, #qr img { width: 100%; height: 100%; }
  .hint { margin: 16px 0 0; font-size: 13px; color: #666; }
  .id { margin: 4px 0 0; font-size: 11px; color: #999; }
  .save { font-size: 12px; color: #888; margin-top: 16px; text-align: center; }
  .error { color: #f66; text-align: center; }
</style>
</head>
<body>
<main>
  <section class="card" id="card" hidden>
    <img class="logo" id="logo" alt="">
    <p class="kicker">Carné de miembro</p>
    <h1 id="store">Miembro</h1>
    <div id="qr"></div>
    <p class="hint">Enséñalo en caja para tu descuento de miembro.</p>
    <p class="id" id="cid"></p>
  </section>
  <p class="error" id="error" hidden>Este enlace no es un carné válido.</p>
  <p class="save" id="save" hidden>Guárdalo: botón compartir → "Añadir a pantalla de inicio".</p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  // URL: ?c=<id del cliente>&s=<nombre de la tienda>  → QR con "SCALA-M:<id>" (lo lee el mosaico Scala Members del POS)
  (function () {
    var p = new URLSearchParams(location.search);
    var id = (p.get("c") || "").replace(/\D/g, "");
    var store = p.get("s") || "";
    // Marcas conocidas: logo + colores del borde. Se activa con ?b=<clave> o por el nombre de la tienda.
    var BRANDS = { usad: { match: /usa distributors/i, logo: "brands/usad/logo.svg", c1: "#EF3118", c2: "#0A3161" } };
    var b = BRANDS[p.get("b") || ""] || Object.keys(BRANDS).map(function (k) { return BRANDS[k]; }).filter(function (x) { return x.match.test(store); })[0];
    if (b) { var card = document.getElementById("card"); card.classList.add("brand"); card.style.setProperty("--c1", b.c1); card.style.setProperty("--c2", b.c2); document.getElementById("logo").src = b.logo; }
    if (!id) { document.getElementById("error").hidden = false; return; }
    if (store) { document.getElementById("store").textContent = store; document.title = "Carné · " + store; }
    document.getElementById("cid").textContent = "#" + id;
    new QRCode(document.getElementById("qr"), { text: "SCALA-M:" + id, width: 480, height: 480, correctLevel: QRCode.CorrectLevel.M });
    document.getElementById("card").hidden = false;
    document.getElementById("save").hidden = false;
  })();
</script>
</body>
</html>
